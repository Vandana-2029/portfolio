<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }} – {{ profile.role }}{% endblock %}</title>
  <meta name="description" content="{{ profile.tagline }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2318212F'/><rect x='4' y='4' width='4' height='4' fill='%23F5B82E'/><rect x='8' y='8' width='4' height='4' fill='%232E46E6'/></svg>">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ url_for('site.home') }}">Vandana<span aria-hidden="true">.</span></a>
      <nav aria-label="Main">
        <ul class="nav">
          <li><a href="{{ url_for('site.home') }}#work">Work</a></li>
          <li><a href="{{ url_for('site.home') }}#about">About</a></li>
          <li><a href="{{ url_for('site.home') }}#contact">Contact</a></li>
          <li><a href="{{ url_for('site.resume') }}" target="_blank">Resume</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p>© {{ year }} {{ profile.name }}. Built with Flask and Jinja.</p>
      <ul class="footer-links">
        <li><a href="{{ profile.github }}" rel="noopener" target="_blank">GitHub</a></li>
        <li><a href="{{ profile.linkedin }}" rel="noopener" target="_blank">LinkedIn</a></li>
        <li><a href="mailto:{{ profile.email }}">Email</a></li>
      </ul>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
